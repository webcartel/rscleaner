schema: 1
rules:
  - id: system.minidumps
    name: Kernel crash dumps
    description: The minidump folder and the full memory dump of a stopped Windows. Useful only while a driver bug is open.
    category: system
    risk: moderate
    platforms: [windows]
    requires_admin: true
    targets:
      - path: '${SYSTEMROOT}\Minidump'
        mode: contents
      - path: '${SYSTEMROOT}\MEMORY.DMP'
        mode: self
