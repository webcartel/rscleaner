name: ci
on: [push, pull_request]

jobs:
  rust:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo run -p rscleaner-rules --bin generate_schema -- --check schema/rule.schema.json
      - run: cargo run -p rscleaner-report --bin generate_report_schema -- --check schema/report.schema.json
      - run: bash scripts/check-i18n-keys.sh
      - run: bash scripts/check-docs-allowlist.sh
      - run: cargo install cargo-deny --locked
      - run: cargo deny check
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz normalize
        run: |
          set +e
          cargo +nightly fuzz run normalize -- -max_total_time=60 -print_final_stats=1 2>&1 | tee fuzz.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            tail_output=$(tail -c 1500 fuzz.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/ /g')
            echo "::error::fuzz exit $code: $tail_output"
          fi
          exit "$code"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash
          path: fuzz/artifacts/**
