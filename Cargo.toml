[workspace]
resolver = "3"
members = [
  "bench/gen",
  "bench/scan",
  "bench/delete",
  "spikes/yaml",
]
exclude = [
  "crates/rscleaner-gui/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
