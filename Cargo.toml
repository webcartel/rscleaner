[workspace]
resolver = "3"
members = [
  "bench/gen",
  "bench/scan",
  "bench/delete",
  "spikes/yaml",
  "spikes/trash",
  "spikes/typegen",
  "crates/rscleaner-model",
  "crates/rscleaner-platform",
  "crates/rscleaner-rules",
  "crates/rscleaner-i18n",
  "crates/rscleaner-cli",
  "crates/rscleaner-guard",
  "crates/rscleaner-scan",
]
exclude = [
  "crates/rscleaner-gui/src-tauri",
  "fuzz",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
assert_cmd = "2.2.2"
clap = { version = "4", features = ["derive"] }
directories = "6"
globset = "0.4"
insta = "1.49.0"
predicates = "3"
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9.42"
rustix = { version = "1", features = ["process"] }
sysinfo = "0.33"
tempfile = "3"
thiserror = "2"
trash = "5.2.9"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
